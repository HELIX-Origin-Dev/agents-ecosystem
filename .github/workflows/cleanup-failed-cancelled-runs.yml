name: Clean up failed workflow runs

on:
  workflow_dispatch:
    inputs:
      amount:
        description: 'Delete up to this many failed or cancelled workflow runs (1-100; blank uses 100)'
        required: false
        default: 100
        type: number

permissions:
  contents: read

concurrency:
  group: cleanup-failed-cancelled-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete failed or cancelled workflow runs
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          AMOUNT: ${{ inputs.amount }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          limit="${AMOUNT:-100}"
          if ! [[ "$limit" =~ ^[0-9]+$ ]]; then
            echo "amount must be an integer between 1 and 100"
            exit 1
          fi
          limit=$((10#$limit))
          if (( limit < 1 || limit > 100 )); then
            echo "amount must be between 1 and 100; received $limit"
            exit 1
          fi

          list_runs() {
            gh api --paginate \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GH_REPO}/actions/runs?status=${1}&per_page=100" \
              --jq '.workflow_runs[] | "\(.id)\t\(.created_at)"'
          }

          candidates="$(
            {
              list_runs failure
              list_runs cancelled
            } | sort -k2,2r | awk -F '\t' -v current="$CURRENT_RUN_ID" -v limit="$limit" '!seen[$1]++ && $1 != current && count < limit { print $1; count++ }'
          )"

          if [[ -z "$candidates" ]]; then
            echo "No failed or cancelled workflow runs found."
            exit 0
          fi

          mapfile -t run_ids <<< "$candidates"
          deleted=0

          for run_id in "${run_ids[@]}"; do
            echo "Deleting workflow run $run_id"
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GH_REPO}/actions/runs/${run_id}" >/dev/null
            deleted=$((deleted + 1))
          done

          echo "Deleted $deleted failed or cancelled workflow run(s)."
